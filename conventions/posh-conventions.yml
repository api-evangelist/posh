reversibility:
  grade: unknown
  state: undocumented
  write_surface: unknown
  operations: []
  note: >-
    Posh's platform plainly has write surfaces — Outreach launches proactive voice/SMS/email
    campaigns, the Portal edits knowledge and behaviours, and the Voice Assistant executes
    transactions and card controls against core banking systems. Whether any of those actions
    can be cancelled, voided or rolled back through the API, and inside what window, is not
    stated anywhere public. This is recorded as UNKNOWN, not as `na`: `na` would claim the API is
    read-only, which it demonstrably is not, and a stated window we did not read would be the one
    error in this pipeline that could cost a Posh customer real money. It is also the most
    consequential public gap in Posh's surface: an agent driving an outreach campaign to a
    financial institution's members has no published way to know whether a send can be recalled.
