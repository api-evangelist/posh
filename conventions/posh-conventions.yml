  header: posh-correlation
  example: '693966d6d52dfc8400da8b3c824956dc'
  scope: response
  note: >-
    Observed on every response from api.poshdevelopment.com, including 404s. A 32-hex correlation
    id is returned unprompted, which is a real and useful agent-facing signal: a client can quote
    it to support without any additional instrumentation. Whether the header is also accepted on
    request (client-supplied correlation) could not be tested without credentials.
  secondary:
