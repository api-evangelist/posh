aid: posh
name: Posh
description: 'Posh (Posh AI, legally Posh Technologies) is a Boston-headquartered, remote-first
  conversational and agentic AI company founded in 2018 by Karan Kashyap and Matt McEachern
  out of MIT''s AI lab. Posh builds AI purpose-built for regulated financial institutions —
  banks and credit unions — combining voice, digital, knowledge and outreach agents on a single
  governed platform driven by its proprietary REALM reasoning engine and "Operating Procedures"
  that pair LLM flexibility with code-level policy control. Its product line spans a Voice
  Assistant for phone banking, a Digital Assistant for web and mobile chat, a Knowledge Assistant
  for employee search, Posh Answers for website search, Posh Outreach for proactive campaigns,
  Posh Simulator for role-play training and Posh CoachQA for quality assurance, all managed from
  the no-code Posh Portal. Posh reports 125+ financial-institution clients and 300+ deployments,
  and integrates with core banking and contact-center platforms including Symitar, Fiserv,
  Corelation, Jack Henry, NICE CXone, Genesys Cloud, RingCentral and Five9. Posh operates a
  private, customer-facing HTTP API behind its portal for custom reporting and system
  integration; that API''s reference is not published publicly.'
