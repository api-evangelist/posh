apis:
- name: Posh Platform API
  description: 'Posh''s customer-facing HTTP API, served from the same gateway that backs the
    Posh Portal. Posh describes it on its portal page as a "powerful API" that "automates custom
    reporting" and connects the portal directly to internal tools and systems. The gateway is
    live and answers unauthenticated requests with a structured JSON error envelope, but its
    reference surface at /api-docs is RBAC-gated (HTTP 403 "RBAC: access denied") and no
    OpenAPI/Swagger document is published on any Posh host.'
  humanURL: https://www.posh.ai/portal
  baseURL: https://api.poshdevelopment.com/api/v1
  x-ownership: >-
    OWNERSHIP CHECK (STEP 0c). The API and the Posh Portal are served from poshdevelopment.com,
    not posh.ai. That is justified from Posh's own pages: www.posh.ai/portal links directly to
    https://app.poshdevelopment.com/login as the portal sign-in, and www.posh.ai's own homepage
    loads its Posh Answers embed from https://poshie-chat-api.poshdevelopment.com/entry-answers.js.
    That shipped loader additionally hard-codes Posh's development, staging and UAT hosts under
    poshdevelopment.com and posh.build. poshdevelopment.com is Posh's product domain; posh.ai is
    its marketing domain.
  x-contract-discovery: >-
    NO MACHINE-READABLE CONTRACT IS PUBLISHED. STEP 0b was run in full against every host.
    (1) REST: /openapi.json, /openapi.yaml, /swagger.json, /v1/openapi.json, /api-docs, /docs,
    /redoc probed on www.posh.ai, api.poshdevelopment.com, app.poshdevelopment.com and
    poshie-chat-api.poshdevelopment.com — all 404, 403 or SPA shell. api.poshdevelopment.com/api-docs
    is the one real hit and returns HTTP 403 "RBAC: access denied". (2) GraphQL: /graphql 404 on the
    API host; no GraphQL surface named anywhere. (3) MCP: mcp.posh.ai NXDOMAIN, no server — see
    mcp/posh-mcp.yml. (4) A2A: /.well-known/agent-card.json and /.well-known/agent.json probed on six
    hosts, all negative — see well-known/posh-well-known.yml. No a2a/ artifact is written.
    Subdomain sweep (api, app, docs, developer, portal, dashboard, console, admin, mcp, status,
    support, help, trust on posh.ai): only app/api/poshie-chat on poshdevelopment.com resolve.
