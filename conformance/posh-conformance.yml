domain_standards:
  note: >-
    Posh sells into US banks and credit unions. The obvious domain standards for that market —
    FDX, FAPI, ISO 20022, X12 — appear nowhere in Posh's published surface, and Posh is a
    conversational-AI layer above the core, not a core banking or payments rail, so no domain
    standard is expected here. Recorded as none-found rather than invented. Posh's own
    integration posture is bilateral connectors to Symitar, Fiserv, Corelation, Jack Henry,
    NICE CXone, Genesys Cloud, RingCentral and Five9 (38 named integrations), which is the
    connector-per-partner pattern a domain standard would replace.
  declared: []
